services:
  nanoclaude:
    build: .
    image: ghcr.io/poag/nanoclaude:latest
    container_name: nanoclaude
    restart: unless-stopped
    stdin_open: true
    tty: true
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    volumes:
      - claude-config:/home/claude/.claude
      - ./workspace:/workspace
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    # Memory guard: leaves headroom on a 512MB Pi Zero 2 for the OS.
    mem_limit: 384m

volumes:
  claude-config:
